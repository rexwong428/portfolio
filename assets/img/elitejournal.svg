<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="ej-title">
  <title id="ej-title">Wireframe of a trading journal: three summary tiles, a candlestick chart, and a table of trades with a profit and loss column</title>

  <rect width="480" height="270" fill="#2D2B38"/>
  <rect x="16" y="16" width="448" height="238" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <!-- title bar -->
  <rect x="32" y="32" width="104" height="9" rx="4" fill="#FFFFFF" fill-opacity="0.30"/>
  <rect x="392" y="32" width="56"  height="9" rx="4" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- three summary tiles -->
  <g>
    <rect x="32"  y="54" width="132" height="38" rx="4" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="42"  y="62" width="40"  height="6" rx="3" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="42"  y="74" width="62"  height="10" rx="3" fill="#77D4CE"/>

    <rect x="174" y="54" width="132" height="38" rx="4" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="184" y="62" width="34"  height="6" rx="3" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="184" y="74" width="52"  height="10" rx="3" fill="#FFFFFF" fill-opacity="0.32"/>

    <rect x="316" y="54" width="132" height="38" rx="4" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="326" y="62" width="46"  height="6" rx="3" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="326" y="74" width="44"  height="10" rx="3" fill="#FFCCB0"/>
  </g>

  <!-- candlestick chart -->
  <g>
    <rect x="32" y="104" width="416" height="72" rx="4" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
      <path d="M32 122.5h416M32 140.5h416M32 158.5h416"/>
    </g>
    <g stroke-width="2">
      <g stroke="#FFFFFF" stroke-opacity="0.30">
        <path d="M56 128v26M80 134v22M104 122v30M152 130v26M176 126v28M224 132v22M272 118v32M296 126v26M344 130v24M392 124v28M416 132v22"/>
      </g>
      <g stroke="#77D4CE"><path d="M128 116v34M248 112v36M368 114v34"/></g>
      <g stroke="#FFCCB0"><path d="M200 136v24M320 138v22"/></g>
    </g>
    <g>
      <rect x="52"  y="133" width="8" height="14" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="76"  y="139" width="8" height="12" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="100" y="128" width="8" height="17" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="124" y="122" width="8" height="21" rx="1" fill="#77D4CE"/>
      <rect x="148" y="135" width="8" height="15" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="172" y="131" width="8" height="17" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="196" y="141" width="8" height="14" rx="1" fill="#FFCCB0"/>
      <rect x="220" y="137" width="8" height="12" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="244" y="118" width="8" height="23" rx="1" fill="#77D4CE"/>
      <rect x="268" y="124" width="8" height="19" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="292" y="131" width="8" height="16" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="316" y="143" width="8" height="12" rx="1" fill="#FFCCB0"/>
      <rect x="340" y="135" width="8" height="14" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="364" y="120" width="8" height="22" rx="1" fill="#77D4CE"/>
      <rect x="388" y="129" width="8" height="18" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="412" y="137" width="8" height="12" rx="1" fill="#FFFFFF" fill-opacity="0.26"/>
    </g>
  </g>

  <!-- trade table: date, symbol, side, qty, price, P&L -->
  <g>
    <g fill="#FFFFFF" fill-opacity="0.22">
      <rect x="32"  y="190" width="40" height="6" rx="3"/>
      <rect x="92"  y="190" width="34" height="6" rx="3"/>
      <rect x="146" y="190" width="24" height="6" rx="3"/>
      <rect x="190" y="190" width="20" height="6" rx="3"/>
      <rect x="230" y="190" width="30" height="6" rx="3"/>
      <rect x="410" y="190" width="38" height="6" rx="3"/>
    </g>
    <line x1="32" y1="202.5" x2="448" y2="202.5" stroke="#FFFFFF" stroke-opacity="0.16"/>

    <g fill="#FFFFFF" fill-opacity="0.14">
      <rect x="32"  y="212" width="52" height="8" rx="3"/><rect x="92" y="212" width="40" height="8" rx="3"/>
      <rect x="146" y="212" width="28" height="8" rx="3"/><rect x="190" y="212" width="22" height="8" rx="3"/>
      <rect x="230" y="212" width="44" height="8" rx="3"/>
      <rect x="32"  y="230" width="52" height="8" rx="3"/><rect x="92" y="230" width="34" height="8" rx="3"/>
      <rect x="146" y="230" width="28" height="8" rx="3"/><rect x="190" y="230" width="22" height="8" rx="3"/>
      <rect x="230" y="230" width="38" height="8" rx="3"/>
    </g>
    <rect x="404" y="212" width="44" height="8" rx="3" fill="#77D4CE"/>
    <rect x="414" y="230" width="34" height="8" rx="3" fill="#FFCCB0"/>
  </g>
</svg>
