<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="er-title">
  <title id="er-title">A crown</title>

  <rect width="480" height="270" fill="#2D2B38"/>

  <!-- soft halo so the mark sits on something rather than floating on flat colour -->
  <circle cx="240" cy="136" r="112" fill="#77D4CE" fill-opacity="0.05"/>
  <circle cx="240" cy="136" r="78"  fill="#77D4CE" fill-opacity="0.05"/>

  <!-- crown body -->
  <path d="M150 176 L158 92 L200 142 L240 74 L280 142 L322 92 L330 176 Z"
        fill="#77D4CE" stroke="#77D4CE" stroke-width="6" stroke-linejoin="round"/>

  <!-- points -->
  <circle cx="158" cy="92" r="11" fill="#7AE6E6"/>
  <circle cx="240" cy="74" r="13" fill="#7AE6E6"/>
  <circle cx="322" cy="92" r="11" fill="#7AE6E6"/>

  <!-- band, overlapping the body base so no seam shows between them -->
  <rect x="144" y="174" width="192" height="34" rx="6" fill="#7AE6E6"/>

  <!-- stones set into the band -->
  <circle cx="196" cy="191" r="6" fill="#2D2B38" fill-opacity="0.55"/>
  <circle cx="240" cy="191" r="7" fill="#FFCCB0"/>
  <circle cx="284" cy="191" r="6" fill="#2D2B38" fill-opacity="0.55"/>
</svg>
